name: Publish to CurseForge

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        run: |
          git clone https://x-access-token:${{ secrets.CHANGELOG_PAT }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref_name }}

      - name: Install Java 25
        run: |
          curl -sL "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse" -o jdk25.tar.gz
          mkdir -p $HOME/jdk25
          tar -xzf jdk25.tar.gz -C $HOME/jdk25 --strip-components=1
          echo "JAVA_HOME=$HOME/jdk25" >> $GITHUB_ENV
          echo "$HOME/jdk25/bin" >> $GITHUB_PATH

      - name: Build and publish
        run: |
          chmod +x gradlew
          ./gradlew curseforge -Ppublish_to_curseforge=true
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

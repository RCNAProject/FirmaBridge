name: Promote Changelog

on:
  push:
    tags:
      - 'v*'

jobs:
  changelog:
    name: Promote Unreleased to Version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        run: |
          git clone https://x-access-token:${{ secrets.CHANGELOG_PAT }}@github.com/${{ github.repository }}.git .
          git checkout FB-dev

      - name: Promote [Unreleased] to tagged version
        run: |
          TAG="${{ github.ref_name }}"
          DATE=$(date -u +%Y-%m-%d)
          python3 - "$TAG" "$DATE" <<'EOF'
          import sys, re

          tag, date = sys.argv[1], sys.argv[2]
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Only promote if [Unreleased] has content — skip if empty to avoid duplicate sections
          match = re.search(r'## \[Unreleased\]\n(.*?)(?=\n## \[|\Z)', content, re.DOTALL)
          if not match or not match.group(1).strip():
              print(f'[Unreleased] is empty, skipping promotion for {tag}')
              sys.exit(0)

          promoted = f'## [Unreleased]\n\n---\n\n## [{tag}] — {date}'
          content = content.replace('## [Unreleased]', promoted, 1)

          with open('CHANGELOG.md', 'w', encoding='utf-8') as f:
              f.write(content)
          EOF

      - name: Commit and push changelog
        run: |
          git config user.name "TheZaltren"
          git config user.email "TheZaltren@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: promote changelog for ${{ github.ref_name }}"
          git push https://x-access-token:${{ secrets.CHANGELOG_PAT }}@github.com/${{ github.repository }}.git HEAD:FB-dev

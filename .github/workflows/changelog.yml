name: Update Changelog

on:
  push:
    branches:
      - FB-dev
    tags:
      - 'v*'

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        run: |
          git clone https://x-access-token:${{ secrets.CHANGELOG_PAT }}@github.com/${{ github.repository }}.git .
          git checkout FB-dev

      - name: Install git-cliff
        run: |
          VERSION=$(curl -s https://api.github.com/repos/orhun/git-cliff/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${VERSION}/git-cliff-${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/git-cliff'

      - name: Generate changelog
        run: git-cliff --verbose --output CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and push changelog
        run: |
          git config user.name "TheZaltren"
          git config user.email "TheZaltren@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: update changelog"
          git push https://x-access-token:${{ secrets.CHANGELOG_PAT }}@github.com/${{ github.repository }}.git HEAD:FB-dev

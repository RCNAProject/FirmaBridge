name: Bug Report
description: Report a bug or unexpected behavior in FirmaBridge.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below as completely as possible.

  - type: input
    id: firmabridge_version
    attributes:
      label: FirmaBridge Version
      placeholder: e.g. v0.2.0-alpha
    validations:
      required: true

  - type: input
    id: tfc_version
    attributes:
      label: TerraFirmaCraft Version
      placeholder: e.g. 1.7.23.181
    validations:
      required: true

  - type: input
    id: gt_version
    attributes:
      label: GregTech CEu Version
      placeholder: e.g. 2.8.10
    validations:
      required: true

  - type: input
    id: forge_version
    attributes:
      label: Forge Version
      placeholder: e.g. 14.23.5.2847
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash Log or Relevant Log Output
      description: Paste your crash report or relevant log lines here.
      render: text

  - type: textarea
    id: other_mods
    attributes:
      label: Other Mods Installed
      description: List any other mods that may be relevant to this bug.

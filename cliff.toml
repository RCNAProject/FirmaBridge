[changelog]
header = """
# Changelog

All notable changes to FirmaBridge will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

---
"""
body = """
{% if version %}\
## [{{ version }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
---
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat|^add",    group = "Added"   },
    { message = "^fix",          group = "Fixed"   },
    { message = "^change|^refactor|^perf", group = "Changed" },
    { message = "^remove|^revert", group = "Removed" },
    { message = "^docs: update changelog", skip = true },
    { message = "^docs",         group = "Documentation" },
    { message = "^chore",        skip = true },
    { message = "^ci",           skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
